<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#120b0a" />
  <title>修仙放置 · V1</title>
  <style>
    :root{--bg:#0d0908;--panel:#17110f;--panel2:#211713;--gold:#e5bd6d;--gold2:#8c6229;--text:#f7eddc;--muted:#b9aa98;--red:#a52217;--red2:#4a120e;--green:#58c78a;--line:rgba(229,189,109,.18)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#3a1711 0,#160c09 38%,#090706 76%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
    body{min-height:100dvh;overflow-x:hidden}
    button{font:inherit;color:inherit}
    .app{max-width:560px;margin:0 auto;min-height:100dvh;padding-bottom:92px;background:linear-gradient(180deg,rgba(77,22,15,.42),rgba(6,5,4,.1) 220px)}
    header{position:sticky;top:0;z-index:20;padding:calc(14px + env(safe-area-inset-top)) 16px 13px;background:linear-gradient(180deg,rgba(29,10,8,.98),rgba(29,10,8,.9));border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
    .top{display:flex;align-items:center;gap:11px}.avatar{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#5b1912,#160a08);border:1px solid rgba(229,189,109,.34);box-shadow:inset 0 0 18px rgba(229,189,109,.07);font-size:25px}.who{flex:1}.name{font-weight:800;font-size:18px;letter-spacing:.06em}.realm-mini{font-size:13px;color:#d8b36e;margin-top:3px}.iconbtn{border:1px solid rgba(229,189,109,.3);background:rgba(255,255,255,.035);width:42px;height:42px;border-radius:13px;font-size:20px}
    main{padding:15px}.hero{position:relative;overflow:hidden;border:1px solid rgba(229,189,109,.3);background:linear-gradient(145deg,rgba(71,27,19,.94),rgba(19,13,11,.96) 60%);border-radius:22px;padding:20px 18px 18px;box-shadow:0 15px 35px rgba(0,0,0,.25)}.hero:after{content:"仙";position:absolute;right:-8px;top:-25px;font-family:serif;font-size:150px;color:rgba(229,189,109,.035);transform:rotate(-8deg)}
    .realm-title{text-align:center;color:#f6d797;font-size:25px;font-weight:900;letter-spacing:.08em;margin:4px 0 19px}.spark{color:#d7a94d;text-shadow:0 0 14px rgba(229,189,109,.6)}
    .stats{display:grid;gap:11px;margin-bottom:13px}.stat{display:flex;justify-content:space-between;align-items:baseline}.stat span:first-child{color:var(--muted);font-size:15px}.stat b{font-size:21px;color:#f7d98f;font-variant-numeric:tabular-nums}.speed{text-align:center;color:#c8b9a8;font-size:14px;margin:15px 0 9px}.bar{height:17px;border-radius:999px;background:#3a2e28;overflow:hidden;border:1px solid rgba(255,255,255,.05)}.fill{height:100%;width:0;background:linear-gradient(90deg,#8b2016,#d5a74b 56%,#f0d789);box-shadow:0 0 18px rgba(229,189,109,.22);transition:width .35s ease}.progress{text-align:center;margin-top:8px;color:#d9c6ab;font-size:14px;font-variant-numeric:tabular-nums}
    .breakthrough{margin-top:14px;width:100%;border:1px solid rgba(229,189,109,.34);border-radius:18px;padding:14px;background:linear-gradient(180deg,#7a2117,#45100d);box-shadow:inset 0 1px rgba(255,255,255,.08)}.breakthrough:disabled{background:#27211e;color:#776b61;border-color:#3b3029}.bt-title{font-size:19px;font-weight:900}.bt-sub{font-size:12px;opacity:.78;margin-top:3px}
    .card{margin-top:14px;background:rgba(23,17,15,.95);border:1px solid var(--line);border-radius:20px;overflow:hidden}.cardhead{display:flex;justify-content:space-between;align-items:center;padding:14px 15px;border-bottom:1px solid var(--line)}.cardhead b{font-size:16px}.pill{font-size:11px;color:#d7bd8b;border:1px solid rgba(229,189,109,.24);border-radius:999px;padding:4px 8px}.logs{padding:5px 14px 12px;min-height:280px}.log{padding:11px 1px;border-bottom:1px dashed rgba(229,189,109,.11);font-size:14px;line-height:1.55}.log:last-child{border:0}.good{color:#f2d18c}.bad{color:#e98b7d}.time{color:#776c64;font-size:11px;margin-right:8px}
    .page{display:none}.page.active{display:block}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.smallcard{background:rgba(23,17,15,.95);border:1px solid var(--line);border-radius:17px;padding:14px}.smallcard .k{color:#9f9185;font-size:12px}.smallcard .v{font-size:22px;font-weight:850;margin-top:5px;color:#f1d08a}.sectiontitle{font-size:20px;font-weight:900;margin:5px 0 13px}.action{width:100%;border:1px solid rgba(229,189,109,.26);background:linear-gradient(180deg,#2f211b,#1b1411);border-radius:16px;padding:14px;text-align:left;margin-bottom:10px}.action strong{display:block;color:#f0d08f}.action small{display:block;color:#9d8f84;margin-top:5px}.fightzone{text-align:center;padding:20px 8px}.enemy{font-size:72px;margin:18px}.hpbar{height:12px;border-radius:99px;background:#322722;overflow:hidden}.hpfill{height:100%;background:linear-gradient(90deg,#6f1611,#d34b36);width:100%;transition:width .25s}.fightbtn{margin-top:16px;border:1px solid #9d722e;background:linear-gradient(180deg,#7f5c23,#473012);padding:13px 28px;border-radius:14px;font-weight:900}
    nav{position:fixed;z-index:30;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:5px;background:rgba(13,9,8,.96);border-top:1px solid var(--line);backdrop-filter:blur(14px)}nav button{border:0;background:transparent;padding:8px 2px;border-radius:12px;color:#8f8177;font-size:11px}nav button .ico{display:block;font-size:21px;margin-bottom:3px}nav button.active{background:rgba(229,189,109,.09);color:#f2d497}
    .toast{position:fixed;left:50%;bottom:98px;transform:translate(-50%,15px);background:#241914;border:1px solid rgba(229,189,109,.35);color:#f3d79d;padding:10px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:99;max-width:88%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.63);display:none;align-items:flex-end;justify-content:center;z-index:80}.modal.show{display:flex}.sheet{width:min(560px,100%);background:#17110f;border:1px solid rgba(229,189,109,.2);border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.danger{border:1px solid #6e2b25;background:#301310;padding:10px 12px;border-radius:11px}.close{width:100%;margin-top:15px;border:1px solid rgba(229,189,109,.28);background:#2a1e18;padding:12px;border-radius:13px}
  </style>
</head>
<body>
<div class="app">
  <header><div class="top"><div class="avatar">☯</div><div class="who"><div class="name">無名修士</div><div class="realm-mini" id="realmMini">煉氣初期</div></div><button class="iconbtn" id="settingsBtn">⚙️</button></div></header>
  <main>
    <section class="page active" data-page="log">
      <div class="hero"><div class="realm-title"><span class="spark">✦</span> <span id="realmTitle">煉氣初期</span></div><div class="stats"><div class="stat"><span>目前修為</span><b id="currentQi">0</b></div><div class="stat"><span>累計修為</span><b id="totalQi">0</b></div></div><div class="speed">修煉速度：<b id="speed">8</b> / 秒</div><div class="bar"><div class="fill" id="fill"></div></div><div class="progress" id="progress">0 / 300</div></div>
      <button class="breakthrough" id="breakBtn" disabled><div class="bt-title" id="nextRealm">晉升煉氣中期</div><div class="bt-sub" id="needText">修為達到要求即可突破</div></button>
      <div class="card"><div class="cardhead"><b>📜 修行日誌</b><span class="pill">自動記錄</span></div><div class="logs" id="logs"></div></div>
    </section>
    <section class="page" data-page="battle"><div class="sectiontitle">⚔️ 戰鬥</div><div class="card fightzone"><div id="enemyName">山林妖狼</div><div class="enemy" id="enemyEmoji">🐺</div><div class="hpbar"><div class="hpfill" id="enemyHpFill"></div></div><div style="margin-top:7px;color:#a99a8f;font-size:13px" id="enemyHpText">120 / 120</div><button class="fightbtn" id="attackBtn">御劍攻擊</button></div></section>
    <section class="page" data-page="stats"><div class="sectiontitle">📊 統計</div><div class="grid2"><div class="smallcard"><div class="k">攻擊</div><div class="v" id="atk">18</div></div><div class="smallcard"><div class="k">氣血</div><div class="v" id="hp">120</div></div><div class="smallcard"><div class="k">突破次數</div><div class="v" id="breaks">0</div></div><div class="smallcard"><div class="k">擊殺妖獸</div><div class="v" id="kills">0</div></div><div class="smallcard"><div class="k">靈石</div><div class="v" id="stones">0</div></div><div class="smallcard"><div class="k">總修煉秒數</div><div class="v" id="secs">0</div></div></div></section>
    <section class="page" data-page="secret"><div class="sectiontitle">🌄 秘境</div><button class="action" id="secretBtn"><strong>青雲秘境 · 每 60 秒可探索</strong><small>可能獲得大量修為、靈石，也可能遭遇兇獸。</small></button><button class="action"><strong>鎖妖塔 · 尚未開放</strong><small>後續版本加入多層戰鬥與稀有掉落。</small></button></section>
    <section class="page" data-page="fate"><div class="sectiontitle">🔮 天機</div><button class="action" id="fateBtn"><strong>今日問卦</strong><small>每天一次，取得隨機修行增益。</small></button><button class="action"><strong>仙緣榜 · 即將開放</strong><small>後續加入排行榜、宗門、好友與世界事件。</small></button></section>
  </main>
</div>
<nav id="nav"><button class="active" data-target="log"><span class="ico">📜</span>日誌</button><button data-target="battle"><span class="ico">⚔️</span>戰鬥</button><button data-target="stats"><span class="ico">📊</span>統計</button><button data-target="secret"><span class="ico">🌄</span>秘境</button><button data-target="fate"><span class="ico">🔮</span>天機</button></nav>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="sheet"><div style="font-size:20px;font-weight:900;margin-bottom:8px">設定</div><div class="row"><span>遊戲版本</span><b>V1.0.0</b></div><div class="row"><span>自動存檔</span><b style="color:#62d497">開啟</b></div><div class="row"><span>離線修煉</span><b style="color:#62d497">開啟</b></div><div class="row"><span>重置進度</span><button class="danger" id="resetBtn">清除存檔</button></div><button class="close" id="closeModal">關閉</button></div></div>
<script>
const realms=[
 ['煉氣初期',300,8],['煉氣中期',900,12],['煉氣後期',2200,18],['煉氣圓滿',5000,26],
 ['築基初期',10000,38],['築基中期',22000,55],['築基後期',48000,78],['築基圓滿',100000,110],
 ['金丹初期',220000,155],['金丹中期',480000,220],['金丹後期',1000000,310],['金丹圓滿',2200000,440],
 ['元嬰初期',5000000,620],['元嬰中期',11000000,880],['元嬰後期',25000000,1250],['元嬰圓滿',60000000,1800],
 ['化神初期',150000000,2600],['化神中期',400000000,3800],['化神後期',1000000000,5600],['化神圓滿',2500000000,8200]
];
const fresh=()=>({qi:0,total:0,realm:0,stones:0,kills:0,breaks:0,seconds:0,last:Date.now(),logs:[],secretAt:0,fateDate:'',enemyHp:120,enemyMax:120});
let s; try{s=Object.assign(fresh(),JSON.parse(localStorage.getItem('xiuxian_v1')||'{}'))}catch(e){s=fresh()}
const $=q=>document.querySelector(q), $$=q=>[...document.querySelectorAll(q)];
function fmt(n){if(n<1000)return Math.floor(n).toString(); const u=[['T',1e12],['B',1e9],['M',1e6],['K',1e3]];for(const [k,v] of u)if(n>=v)return (n/v).toFixed(n>=v*100?0:1)+k;return Math.floor(n)}
function speed(){return realms[s.realm]?.[2]||12000}
function req(){return realms[s.realm]?.[1]||Infinity}
function log(text,type='good'){s.logs.unshift({t:Date.now(),text,type});s.logs=s.logs.slice(0,30);renderLogs()}
function renderLogs(){const box=$('#logs');box.innerHTML=s.logs.map(x=>`<div class="log ${x.type}"><span class="time">${new Date(x.t).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}</span>${x.text}</div>`).join('')||'<div class="log">你盤膝而坐，開始感受天地靈氣……</div>'}
function save(){s.last=Date.now();localStorage.setItem('xiuxian_v1',JSON.stringify(s))}
function render(){const r=realms[s.realm]||['渡劫圓滿',Infinity,12000]; $('#realmMini').textContent=r[0];$('#realmTitle').textContent=r[0];$('#currentQi').textContent=fmt(s.qi);$('#totalQi').textContent=fmt(s.total);$('#speed').textContent=fmt(speed());$('#progress').textContent=`${fmt(s.qi)} / ${fmt(req())}`;$('#fill').style.width=Math.min(100,s.qi/req()*100)+'%';const next=realms[s.realm+1];$('#nextRealm').textContent=next?`晉升${next[0]}`:'已達當前最高境界';$('#breakBtn').disabled=!next||s.qi<req();$('#needText').textContent=s.qi>=req()?'修為已滿，可以突破':'修為達到要求即可突破';$('#atk').textContent=18+s.realm*7;$('#hp').textContent=120+s.realm*28;$('#breaks').textContent=s.breaks;$('#kills').textContent=s.kills;$('#stones').textContent=fmt(s.stones);$('#secs').textContent=fmt(s.seconds);$('#enemyHpFill').style.width=Math.max(0,s.enemyHp/s.enemyMax*100)+'%';$('#enemyHpText').textContent=`${Math.max(0,Math.floor(s.enemyHp))} / ${s.enemyMax}`}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
const offline=Math.max(0,Math.min(8*3600,(Date.now()-s.last)/1000));if(offline>8){const gain=Math.floor(offline*speed()*.6);s.qi+=gain;s.total+=gain;s.seconds+=Math.floor(offline);log(`離線修煉 ${Math.floor(offline/60)} 分鐘，獲得 +${fmt(gain)} 修為`)}
setInterval(()=>{const g=speed();s.qi+=g;s.total+=g;s.seconds++;if(Math.random()<.045){const events=[['你參悟殘卷，心有所悟',1.8],['月華凝聚，靈台清明',2.3],['發現一處微型靈脈',3.1],['吐納之間，道心更穩',1.35]];const [txt,m]=events[Math.floor(Math.random()*events.length)];const bonus=Math.floor(g*m*8);s.qi+=bonus;s.total+=bonus;log(`${txt}　+${fmt(bonus)} 修為`)}render();if(s.seconds%5===0)save()},1000);
$('#breakBtn').onclick=()=>{if(s.qi<req()||!realms[s.realm+1])return;const cost=req();s.qi-=cost;s.realm++;s.breaks++;log(`✨ 突破成功！你踏入 ${realms[s.realm][0]}`);toast('突破成功');render();save()};
$('#attackBtn').onclick=()=>{let dmg=18+s.realm*7+Math.floor(Math.random()*12);s.enemyHp-=dmg;if(s.enemyHp<=0){s.kills++;const reward=35+s.realm*9;const q=120+speed()*6;s.stones+=reward;s.qi+=q;s.total+=q;log(`斬殺山林妖狼，獲得 ${reward} 靈石、+${fmt(q)} 修為`);toast('妖獸已斬殺');s.enemyMax=Math.floor(120*(1+s.kills*.08));s.enemyHp=s.enemyMax}else toast(`造成 ${dmg} 傷害`);render();save()};
$('#secretBtn').onclick=()=>{const now=Date.now();if(now-s.secretAt<60000)return toast(`秘境冷卻 ${Math.ceil((60000-(now-s.secretAt))/1000)} 秒`);s.secretAt=now;const good=Math.random()>.22;if(good){const q=Math.floor(speed()*(40+Math.random()*50)),st=Math.floor(80+Math.random()*120);s.qi+=q;s.total+=q;s.stones+=st;log(`你在青雲秘境發現靈泉，+${fmt(q)} 修為、+${st} 靈石`);toast('秘境大有收穫')}else{const loss=Math.min(s.qi,Math.floor(req()*.03));s.qi-=loss;log(`秘境遭遇兇獸偷襲，損失 ${fmt(loss)} 修為`,'bad');toast('遭遇兇險')}render();save()};
$('#fateBtn').onclick=()=>{const d=new Date().toDateString();if(s.fateDate===d)return toast('今日已問過天機');s.fateDate=d;const q=Math.floor(speed()*(90+Math.random()*100));s.qi+=q;s.total+=q;log(`🔮 卦象：紫氣東來。今日機緣 +${fmt(q)} 修為`);toast('今日卦象：上吉');render();save()};
$('#nav').onclick=e=>{const b=e.target.closest('button[data-target]');if(!b)return;$$('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$$('.page').forEach(x=>x.classList.toggle('active',x.dataset.page===b.dataset.target))};
$('#settingsBtn').onclick=()=>$('#modal').classList.add('show');$('#closeModal').onclick=()=>$('#modal').classList.remove('show');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')};$('#resetBtn').onclick=()=>{if(confirm('確定要清除所有修仙進度嗎？')){localStorage.removeItem('xiuxian_v1');location.reload()}};
window.addEventListener('beforeunload',save);renderLogs();render();save();
</script>
</body></html>
