<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#100a08"><title>修仙放置 V1.3.2</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:radial-gradient(circle at top,#39170f,#100907 45%,#070605);color:#f5ead9;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:88px}header{position:sticky;top:0;z-index:5;background:#160e0bdc;backdrop-filter:blur(12px);padding:14px 15px;border-bottom:1px solid #e7c47d2b}.top{display:flex;align-items:center;gap:10px}.avatar{font-size:25px;width:45px;height:45px;display:grid;place-items:center;border:1px solid #e7c47d55;border-radius:14px}.who{flex:1}.name{font-weight:900;font-size:18px}.sub,.muted{color:#a99b8f;font-size:12px}.curr{font-size:11px;text-align:right;color:#e9cb8d}main{padding:14px}.page{display:none}.page.active{display:block}.card,.hero,.item{background:linear-gradient(150deg,#261812,#120d0b);border:1px solid #e7c47d2c;border-radius:18px}.hero{padding:18px}.realm{text-align:center;font-size:25px;font-weight:900;color:#f2d18f;margin-bottom:15px}.stat{display:flex;justify-content:space-between;margin:10px 0}.stat span{color:#a99b8f}.stat b{color:#f2d18f}.bar{height:15px;background:#382b25;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#8c2117,#d49b43,#f3d994)}.btn{width:100%;border:1px solid #e7c47d4d;background:linear-gradient(#6e2418,#40120e);padding:13px;border-radius:14px;color:#fff;margin-top:10px;font-weight:800}.btn:disabled{opacity:.35}.section{font-size:20px;font-weight:900;margin:4px 0 12px}.card{margin-top:12px;overflow:hidden}.head{padding:13px 14px;border-bottom:1px solid #e7c47d22;display:flex;justify-content:space-between}.row{padding:12px 14px;border-bottom:1px solid #e7c47d18;display:flex;justify-content:space-between;align-items:center;gap:10px}.row:last-child{border:0}.logs{padding:4px 14px 10px;min-height:210px}.log{padding:9px 0;border-bottom:1px dashed #e7c47d18;font-size:13px}.enemy{text-align:center;font-size:70px;padding:12px}.hp{height:12px;background:#342720;border-radius:99px;overflow:hidden}.ehp{height:100%;background:#b43a2c}.php{height:100%;background:#4aa977}.battle{padding:15px}.battle small{color:#9d8e82}.auto{background:#173a29;border-color:#4ea978}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tile{padding:13px}.tile b{display:block;color:#efcf8b;font-size:20px;margin-top:4px}.shopTabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:11px}.shopTabs button{padding:11px;border-radius:12px;border:1px solid #e7c47d33;background:#231711;color:#c9b59b}.shopTabs button.on{background:#5b2517;color:#f4d391}.shopgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.item{padding:13px}.item .ico{font-size:30px}.item strong{display:block;margin-top:6px}.item small{display:block;color:#94877c;min-height:34px;margin-top:4px}.buy{width:100%;margin-top:9px;padding:9px 5px;border:1px solid #e7c47d42;border-radius:10px;background:#382419;color:#f2d18d}.boss{color:#e98b7d;font-weight:900}.mini{border:1px solid #e7c47d3a;background:#332219;border-radius:10px;padding:8px;color:#f2d18d}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#0d0908f2;border-top:1px solid #e7c47d2a;padding:7px 5px calc(7px + env(safe-area-inset-bottom));z-index:8}nav button{border:0;background:none;color:#8f8177;font-size:10px;padding:7px 0;border-radius:10px}nav button span{display:block;font-size:20px;margin-bottom:2px}nav button.on{color:#f2d18f;background:#e7c47d12}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#251813;border:1px solid #e7c47d55;padding:10px 14px;border-radius:11px;opacity:0;transition:.2s;z-index:20}.toast.show{opacity:1}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.show{display:flex}.sheet{width:min(560px,100%);background:linear-gradient(180deg,#24150f,#100b09);border:1px solid #e7c47d4a;border-radius:24px 24px 0 0;padding:22px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px #0008}.sheet .shopIcon{font-size:54px;text-align:center}.sheet h3{text-align:center;margin:8px 0 4px;color:#f3d696}.sheet p{text-align:center;color:#aa9a8d;font-size:13px;margin:0 0 16px}.priceBox{display:flex;justify-content:space-between;align-items:center;background:#ffffff08;border:1px solid #e7c47d22;border-radius:14px;padding:12px 14px;margin-bottom:14px}.priceBox b{color:#f4d391}.modalBtns{display:grid;grid-template-columns:1fr 1fr;gap:9px}.modalBtns button{padding:12px;border-radius:12px;border:1px solid #e7c47d33}.cancel{background:#241914;color:#b9aa9d}.confirm{background:linear-gradient(#74431f,#4a2816);color:#f8e1ad;font-weight:900}.hint{margin-top:9px;text-align:center;color:#7f746c;font-size:11px}</style></head><body><div class="app"><header><div class="top"><div class="avatar">☯</div><div class="who"><div class="name">無名修士</div><div class="sub" id="miniRealm">煉氣初期</div></div><div class="curr">💠 <b id="jadeTop">100</b> 仙玉<br>🪨 <b id="stoneTop">0</b> 靈石</div></div></header><main><section class="page active" id="cultivate"><div class="hero"><div class="realm" id="realm">煉氣初期</div><div class="stat"><span>目前修為</span><b id="qi">0</b></div><div class="stat"><span>修煉速度</span><b><span id="speed">4</span>/秒</b></div><div class="bar"><div class="fill" id="qfill"></div></div><div class="sub" style="text-align:center;margin-top:7px" id="qtext"></div></div><button class="btn" id="breakBtn">突破境界</button><div class="card"><div class="head"><b>📜 修行日誌</b><span class="muted">自動修煉</span></div><div class="logs" id="logs"></div></div></section><section class="page" id="battle"><div class="section">⚔️ 自動戰鬥</div><div class="card battle"><div style="display:flex;justify-content:space-between"><b id="area">青石山脈</b><span id="stage"></span></div><div id="bossTag" class="boss" style="text-align:center;margin-top:8px"></div><div class="enemy" id="enemy">🐺</div><small>妖獸氣血</small><div class="hp"><div class="ehp" id="ehp"></div></div><small id="etext"></small><div style="margin-top:12px"><small>自身氣血</small><div class="hp"><div class="php" id="php"></div></div><small id="ptext"></small></div><button class="btn auto" id="auto">自動戰鬥：開啟</button></div><div class="card"><div class="head"><b>區域進度</b><span class="muted">每 10 關 Boss</span></div><div class="row"><span>最高關卡</span><b id="best"></b></div><div class="row"><span>妖丹</span><b id="cores"></b></div></div></section><section class="page" id="growth"><div class="section">🧘 成長</div><div class="card"><div class="row"><div><b>功法修煉</b><div class="muted" id="manual"></div></div><button class="mini" id="manualBtn">升級</button></div><div class="row"><div><b>聚氣丹</b><div class="muted">5 妖丹煉製，服用獲得 45 秒修為</div></div><button class="mini" id="pillBtn">煉製</button></div><div class="row"><div><b>丹藥庫存</b><div class="muted" id="pills"></div></div><button class="mini" id="usePill">服用</button></div></div><div class="grid" style="margin-top:10px"><div class="card tile"><span class="muted">攻擊</span><b id="atk"></b></div><div class="card tile"><span class="muted">氣血</span><b id="maxhp"></b></div></div></section><section class="page" id="secret"><div class="section">🌄 秘境</div><button class="btn" id="secretBtn">探索青雲秘境</button><div class="card"><div class="row"><span>擊殺妖獸</span><b id="kills"></b></div><div class="row"><span>突破次數</span><b id="breaks"></b></div><div class="row"><span>總修為</span><b id="total"></b></div></div></section><section class="page" id="shop"><div class="section">🏮 仙坊商城</div><div class="shopTabs"><button class="on" data-shop="stone">靈石商城</button><button data-shop="jade">仙玉商城</button></div><div class="shopgrid" id="shopgrid"></div><div class="card"><div class="head"><b>商城說明</b></div><div class="row"><span class="muted">仙玉目前由遊戲內獎勵取得，尚未接入真實儲值。</span></div></div></section></main></div><nav><button class="on" data-page="cultivate"><span>☯</span>修煉</button><button data-page="battle"><span>⚔️</span>戰鬥</button><button data-page="growth"><span>🧘</span>成長</button><button data-page="secret"><span>🌄</span>秘境</button><button data-page="shop"><span>🏮</span>商城</button></nav><div class="toast" id="toast"></div><div class="modal" id="buyModal"><div class="sheet"><div class="shopIcon" id="mIcon">🎁</div><h3 id="mName">商品名稱</h3><p id="mDesc">商品說明</p><div class="priceBox"><span>購買價格</span><b id="mPrice"></b></div><div class="modalBtns"><button class="cancel" id="mCancel">再想一下</button><button class="confirm" id="mConfirm">確認購買</button></div><div class="hint" id="mBalance"></div></div></div><script>const R=[['煉氣初期',480,4],['煉氣中期',1600,5],['煉氣後期',4800,6],['煉氣圓滿',12000,8],['築基初期',42000,10],['築基中期',110000,13],['築基後期',280000,17],['築基圓滿',700000,22],['金丹初期',1800000,28],['金丹中期',4500000,36],['金丹後期',11000000,47],['金丹圓滿',26000000,62],['元嬰初期',62000000,82],['元嬰中期',145000000,108],['元嬰後期',350000000,145],['元嬰圓滿',820000000,195],['化神初期',2e9,260],['化神中期',4.8e9,350],['化神後期',11.5e9,480],['化神圓滿',28e9,660]];const areas=[['青石山脈','🐺'],['幽冥古林','🐗'],['赤炎荒原','🦂'],['萬妖谷','🐉'],['天外仙域','👹']];const fresh=()=>({qi:0,total:0,realm:0,stones:0,jade:100,kills:0,breaks:0,cores:0,pills:0,manual:1,stage:1,best:1,enemyHp:0,enemyMax:0,playerHp:0,auto:true,lastBattle:0,last:Date.now(),logs:[],secretAt:0,buffs:{speedUntil:0,atkUntil:0},buys:{}});let s;try{s=Object.assign(fresh(),JSON.parse(localStorage.getItem('xiuxian_v1')||'{}'));if(s.jade==null)s.jade=100;if(!s.buffs)s.buffs={speedUntil:0,atkUntil:0};if(!s.buys)s.buys={}}catch{s=fresh()}const $=x=>document.querySelector(x),$$=x=>[...document.querySelectorAll(x)];function fmt(n){if(n<1000)return Math.floor(n);for(const [k,v] of [['B',1e9],['M',1e6],['K',1e3]])if(n>=v)return (n/v).toFixed(n>=v*100?0:1)+k}function spd(){let x=R[s.realm][2]*(1+(s.manual-1)*.025);if(Date.now()<s.buffs.speedUntil)x*=2;return Math.max(1,Math.floor(x))}function req(){return R[s.realm][1]}function atk(){let x=22+s.realm*4+(s.manual-1)*2;if(Date.now()<s.buffs.atkUntil)x*=1.5;return Math.floor(x)}function mhp(){return 170+s.realm*20}function em(){let boss=s.stage%10===0?2.8:1;return Math.floor(420*Math.pow(1.15,s.stage-1)*(1+s.realm*.1)*boss)}function eatk(){return Math.floor(8*Math.pow(1.10,s.stage-1)*(s.stage%10===0?1.6:1))}function save(){s.last=Date.now();localStorage.setItem('xiuxian_v1',JSON.stringify(s))}function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1400)}function log(t){s.logs.unshift({t:Date.now(),x:t});s.logs=s.logs.slice(0,20)}function resetFight(){s.enemyMax=em();s.enemyHp=s.enemyMax;s.playerHp=mhp()}if(!s.enemyMax)resetFight();function render(){let area=Math.min(areas.length-1,Math.floor((s.stage-1)/20));$('#realm').textContent=$('#miniRealm').textContent=R[s.realm][0];$('#qi').textContent=fmt(s.qi);$('#speed').textContent=fmt(spd());$('#qfill').style.width=Math.min(100,s.qi/req()*100)+'%';$('#qtext').textContent=`${fmt(s.qi)} / ${fmt(req())}`;$('#breakBtn').disabled=s.qi<req()||s.realm>=R.length-1;$('#jadeTop').textContent=fmt(s.jade);$('#stoneTop').textContent=fmt(s.stones);$('#area').textContent=areas[area][0];$('#enemy').textContent=areas[area][1];$('#stage').textContent=`第 ${s.stage} 關`;$('#bossTag').textContent=s.stage%10===0?'⚠️ BOSS 關卡':'';$('#ehp').style.width=Math.max(0,s.enemyHp/s.enemyMax*100)+'%';$('#etext').textContent=`${Math.max(0,Math.floor(s.enemyHp))} / ${s.enemyMax}`;$('#php').style.width=Math.max(0,s.playerHp/mhp()*100)+'%';$('#ptext').textContent=`${Math.max(0,Math.floor(s.playerHp))} / ${mhp()}`;$('#auto').textContent=`自動戰鬥：${s.auto?'開啟':'關閉'}`;$('#best').textContent=s.best;$('#cores').textContent=s.cores;$('#manual').textContent=`吐納訣 Lv.${s.manual} · 修煉 +${Math.round((s.manual-1)*2.5)}%`;$('#pills').textContent=`聚氣丹 × ${s.pills}`;$('#atk').textContent=atk();$('#maxhp').textContent=mhp();$('#kills').textContent=s.kills;$('#breaks').textContent=s.breaks;$('#total').textContent=fmt(s.total);$('#logs').innerHTML=s.logs.map(x=>`<div class="log">${x.x}</div>`).join('')||'<div class="log muted">你開始吐納天地靈氣……</div>'}let off=Math.min(8*3600,(Date.now()-s.last)/1000);if(off>15){let q=Math.floor(off*spd()*.35);s.qi+=q;s.total+=q;log(`離線修煉獲得 +${fmt(q)} 修為`)}setInterval(()=>{let q=spd();s.qi+=q;s.total+=q;render();save()},1000);setInterval(()=>{if(!s.auto||Date.now()-s.lastBattle<1500)return;s.lastBattle=Date.now();s.enemyHp-=Math.floor(atk()*(.85+Math.random()*.25));if(s.enemyHp<=0){s.kills++;let boss=s.stage%10===0,st=Math.floor((6+s.stage*1.5)*(boss?3:1));s.stones+=st;if(Math.random()<(boss?.32:.12))s.cores++;if(boss&&Math.random()<.22)s.jade+=2;s.stage++;s.best=Math.max(s.best,s.stage);resetFight();log(`${boss?'擊敗關卡 BOSS':'斬殺妖獸'}，獲得 ${st} 靈石`)}else{s.playerHp-=eatk();if(s.playerHp<=0){s.stage=Math.max(1,s.stage-1);resetFight();log('戰鬥落敗，退回上一關休整')}}render();save()},300);$('#breakBtn').onclick=()=>{if(s.qi<req())return;let chance=s.realm<4?.98:Math.max(.55,.92-s.realm*.025);if(Math.random()>chance){let l=req()*.08;s.qi-=l;log(`突破失敗，損失 ${fmt(l)} 修為`);toast('突破失敗')}else{s.qi-=req();s.realm++;s.breaks++;resetFight();log(`成功突破至 ${R[s.realm][0]}`);toast('渡劫成功')}render();save()};$('#auto').onclick=()=>{s.auto=!s.auto;render();save()};$('#manualBtn').onclick=()=>{let c=500*s.manual;if(s.stones<c)return toast(`需要 ${c} 靈石`);s.stones-=c;s.manual++;toast('功法升級');render();save()};$('#pillBtn').onclick=()=>{if(s.cores<5)return toast('需要 5 妖丹');s.cores-=5;s.pills++;render();save()};$('#usePill').onclick=()=>{if(!s.pills)return toast('沒有聚氣丹');s.pills--;let q=spd()*45;s.qi+=q;s.total+=q;toast(`修為 +${fmt(q)}`);render();save()};$('#secretBtn').onclick=()=>{if(Date.now()-s.secretAt<300000)return toast('秘境尚未恢復');s.secretAt=Date.now();let q=spd()*30,st=40+Math.floor(Math.random()*50);s.qi+=q;s.total+=q;s.stones+=st;toast('秘境探索完成');render();save()};const goods={stone:[['🧪','聚氣丹','直接獲得 1 顆聚氣丹',350,'stone','pill'],['🦴','妖丹袋','獲得 3 顆妖丹',500,'stone','core'],['📜','修煉符','修煉速度 ×2，持續 10 分鐘',1800,'stone','speed'],['⚔️','戰意符','攻擊 +50%，持續 10 分鐘',1600,'stone','atk']],jade:[['🎁','修行禮包','聚氣丹×3、妖丹×5、靈石×500',30,'jade','pack'],['✨','高階修煉符','修煉速度 ×2，持續 1 小時',40,'jade','speed60'],['💰','靈石箱','獲得 3000 靈石',50,'jade','stones'],['🔮','天命玉簡','立即獲得 10 分鐘修煉量',35,'jade','qi']]};let shopType='stone',pending=null;function shop(){let cur=shopType==='stone'?'靈石':'仙玉';$('#shopgrid').innerHTML=goods[shopType].map((g,i)=>`<div class="item"><div class="ico">${g[0]}</div><strong>${g[1]}</strong><small>${g[2]}</small><button class="buy" data-buy="${i}">${g[3]} ${cur}</button></div>`).join('')}function openBuy(g){pending=g;let cur=shopType==='stone'?'靈石':'仙玉',wallet=shopType==='stone'?'stones':'jade';$('#mIcon').textContent=g[0];$('#mName').textContent=g[1];$('#mDesc').textContent=g[2];$('#mPrice').textContent=`${g[3]} ${cur}`;$('#mBalance').textContent=`目前持有：${fmt(s[wallet])} ${cur}`;$('#buyModal').classList.add('show')}function closeBuy(){pending=null;$('#buyModal').classList.remove('show')}function doBuy(){if(!pending)return;let g=pending,wallet=shopType==='stone'?'stones':'jade',cur=shopType==='stone'?'靈石':'仙玉';if(s[wallet]<g[3]){closeBuy();toast(`${cur}不足`);return}s[wallet]-=g[3];if(g[5]==='pill')s.pills++;if(g[5]==='core')s.cores+=3;if(g[5]==='speed')s.buffs.speedUntil=Math.max(Date.now(),s.buffs.speedUntil)+600000;if(g[5]==='atk')s.buffs.atkUntil=Math.max(Date.now(),s.buffs.atkUntil)+600000;if(g[5]==='pack'){s.pills+=3;s.cores+=5;s.stones+=500}if(g[5]==='speed60')s.buffs.speedUntil=Math.max(Date.now(),s.buffs.speedUntil)+3600000;if(g[5]==='stones')s.stones+=3000;if(g[5]==='qi'){let q=spd()*600;s.qi+=q;s.total+=q}closeBuy();toast('購買成功');render();save()}$$('[data-shop]').forEach(b=>b.onclick=()=>{$$('[data-shop]').forEach(x=>x.classList.remove('on'));b.classList.add('on');shopType=b.dataset.shop;shop()});$('#shopgrid').onclick=e=>{let b=e.target.closest('[data-buy]');if(!b)return;openBuy(goods[shopType][+b.dataset.buy])};$('#mCancel').onclick=closeBuy;$('#mConfirm').onclick=doBuy;$('#buyModal').onclick=e=>{if(e.target.id==='buyModal')closeBuy()};$$('nav button').forEach(b=>b.onclick=()=>{$$('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');$$('.page').forEach(x=>x.classList.remove('active'));$('#'+b.dataset.page).classList.add('active')});shop();render();save();</script></body></html>
